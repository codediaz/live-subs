[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "live-subs"
version = "0.1.0"
description = "Real-time multilingual subtitles for conferences with parallel stages."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
# Pinned and justified in specs/001-subs-mvp/research.md (Dependencias).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "websockets==16.1.1",
    "pydantic==2.13.5",
    "redis==8.1.0",
    "google-genai==2.25.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
